<ng-container *ngVar="(breadcrumbs$ | async) as breadcrumbs">
  @if ((showBreadcrumbs$ | async)) {
    <!-- Bandeau signalant la zone "annuaire des chercheurs" (voir breadcrumbs.component.ts) -->
    <div class="annuaire-banner">
      <div class="container annuaire-banner__inner">
        <span class="annuaire-banner__icon" aria-hidden="true"><i class="fas fa-university"></i></span>
        <div class="annuaire-banner__text">
          <span class="annuaire-banner__title">{{ 'papyrus.annuaires.banner-title' | translate }}</span>
          <span class="annuaire-banner__subtitle">{{ 'papyrus.annuaires.banner-subtitle' | translate }}</span>
        </div>
      </div>
    </div>

    <nav aria-label="breadcrumb" class="nav-breadcrumb">
      <ol class="container breadcrumb my-0">
        <ng-container
        *ngTemplateOutlet="breadcrumbs?.length > 0 ? breadcrumb : activeBreadcrumb; context: {text: 'home.breadcrumbs', url: '/'}"></ng-container>
        @for (bc of breadcrumbs; track bc; let last = $last) {
          <ng-container *ngTemplateOutlet="!last ? breadcrumb : activeBreadcrumb; context: bc"></ng-container>
        }

        <!-- Bouton "Retour aux résultats" aligné sur la même ligne que le fil d'Ariane -->
        <li class="breadcrumb-item annuaire-backbutton-item" *ngIf="showBackButton$ | async">
          <ds-results-back-button [back]="back"></ds-results-back-button>
        </li>
      </ol>
    </nav>
  }

  <ng-template #breadcrumb let-text="text" let-url="url">
    <li class="breadcrumb-item"><div class="breadcrumb-item-limiter"><a [routerLink]="url" class="text-truncate" [ngbTooltip]="text | translate" placement="bottom" role="link" tabindex="0">{{text | translate}}</a></div></li>
  </ng-template>

  <ng-template #activeBreadcrumb let-text="text">
    <li class="breadcrumb-item active" aria-current="page"><div class="breadcrumb-item-limiter"><div class="text-truncate">{{text | translate}}</div></div></li>
  </ng-template>
</ng-container>
