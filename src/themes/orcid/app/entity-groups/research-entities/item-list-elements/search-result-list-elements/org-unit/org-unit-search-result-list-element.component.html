<div class="directory-search-result-card">
  <a *ngIf="linkType !== linkTypes.None" [target]="(linkType === linkTypes.ExternalLink) ? '_blank' : '_self'"
     [attr.rel]="(linkType === linkTypes.ExternalLink) ? 'noopener noreferrer' : null"
     [routerLink]="[itemPageRoute]" class="directory-search-result-card__thumbnail" role="link" tabindex="-1">
    <ds-thumbnail [thumbnail]="dso?.thumbnail | async"
                  [defaultImage]="'assets/images/orgunit-placeholder.svg'"
                  [alt]="'thumbnail.orgunit.alt'"
                  [placeholder]="'thumbnail.orgunit.placeholder'">
    </ds-thumbnail>
  </a>

  <div class="directory-search-result-card__body">
    <ds-badges *ngIf="showLabel" [object]="dso" [context]="context"></ds-badges>

    <ds-truncatable [id]="dso.id">
      <a *ngIf="linkType !== linkTypes.None" [target]="(linkType === linkTypes.ExternalLink) ? '_blank' : '_self'"
         [attr.rel]="(linkType === linkTypes.ExternalLink) ? 'noopener noreferrer' : null"
         [routerLink]="[itemPageRoute]" class="directory-search-result-card__name"
         [innerHTML]="dsoTitle || ('orgunit.listelement.no-title' | translate)" role="link" tabindex="0"></a>
      <span *ngIf="linkType === linkTypes.None"
            class="directory-search-result-card__name"
            [innerHTML]="dsoTitle || ('orgunit.listelement.no-title' | translate)"></span>

      <span *ngIf="dso.allMetadata(['dc.description']).length > 0" class="directory-search-result-card__meta">
        <ds-truncatable-part [id]="dso.id" [minLines]="3">
          <span [innerHTML]="firstMetadataValue('dc.description')"></span>
        </ds-truncatable-part>
      </span>
    </ds-truncatable>
  </div>
</div>
