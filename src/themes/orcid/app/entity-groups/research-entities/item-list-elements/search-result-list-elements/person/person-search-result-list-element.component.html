<div class="directory-search-result-card">
  <a *ngIf="linkType !== linkTypes.None" [target]="(linkType === linkTypes.ExternalLink) ? '_blank' : '_self'"
     [attr.rel]="(linkType === linkTypes.ExternalLink) ? 'noopener noreferrer' : null"
     [routerLink]="[itemPageRoute]" class="directory-search-result-card__thumbnail" role="link" tabindex="-1">
    <ds-thumbnail [thumbnail]="dso?.thumbnail | async"
                  [defaultImage]="'assets/orcid/images/person-placeholder.svg'"
                  [alt]="'thumbnail.person.alt'"
                  [placeholder]="'thumbnail.person.placeholder'">
    </ds-thumbnail>
  </a>

  <div class="directory-search-result-card__body">
    <ds-badges *ngIf="showLabel" [object]="dso" [context]="context"></ds-badges>

    <ds-truncatable [id]="dso.id">
      <a *ngIf="linkType !== linkTypes.None" [target]="(linkType === linkTypes.ExternalLink) ? '_blank' : '_self'"
         [attr.rel]="(linkType === linkTypes.ExternalLink) ? 'noopener noreferrer' : null"
         [routerLink]="[itemPageRoute]" class="directory-search-result-card__name stretched-link"
         [innerHTML]="dsoTitle || ('person.listelement.no-title' | translate)" role="link" tabindex="0"></a>
      <span *ngIf="linkType === linkTypes.None"
            class="directory-search-result-card__name"
            [innerHTML]="dsoTitle || ('person.listelement.no-title' | translate)"></span>

      <ds-truncatable-part [id]="dso.id" [minLines]="1">
        <span *ngIf="dso.allMetadata(['person.jobTitle']).length > 0" class="directory-search-result-card__meta">
          <span *ngFor="let value of allMetadataValues(['person.jobTitle']); let last=last;">
            <span [innerHTML]="value"></span><span *ngIf="!last">, </span>
          </span>
        </span>
      </ds-truncatable-part>
    </ds-truncatable>

    <a *ngIf="hasOrcid" [href]="orcidUrl" target="_blank" rel="noopener noreferrer"
       class="directory-search-result-card__orcid-badge">
      <img src="assets/images/orcid.logo.icon.svg" alt="" aria-hidden="true" width="16" height="16"/>
      {{ 'papyrus.directory.orcid-badge' | translate }}
    </a>
  </div>

  <i *ngIf="linkType !== linkTypes.None" class="fas fa-chevron-right directory-search-result-card__arrow" aria-hidden="true"></i>
</div>
